services:
  lumisshow:
    image: ghcr.io/euikuk-jeong/lumisshow:latest
    container_name: lumisshow
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    volumes:
      - /volume1/photo:/mnt/photos:ro        # NAS 사진 폴더 (읽기 전용)
      - /volume1/docker/lumisshow:/data      # DB, 썸네일, 음악 저장
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - PHOTO_ROOT=/mnt/photos
      - DATA_DIR=/data
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      - APP_PORT=${APP_PORT:-8080}
      - PUID=${PUID:-}
      - PGID=${PGID:-}

  lumisshow-ai:
    image: ghcr.io/euikuk-jeong/lumisshow-ai:latest
    container_name: lumisshow-ai
    restart: unless-stopped
    mem_limit: 2g                            # 분석 중 메모리 스파이크가 NAS 전체에 번지지 않도록 제한
    volumes:
      - /volume1/photo:/mnt/photos:ro        # lumisshow와 동일 마운트 (읽기 전용)
      - /volume1/docker/lumisshow:/data      # ai.db, faces/, models/ 공유
    environment:
      - PHOTO_ROOT=/mnt/photos
      - DATA_DIR=/data
      - BASE_URL=${BASE_URL:-http://localhost:8080}  # Discord 알림에 붙는 admin 링크
      - TZ=${TZ:-Asia/Seoul}                 # AI_SCAN_HOUR가 이 TZ 기준으로 동작
      - AI_SCAN_HOUR=${AI_SCAN_HOUR:-2}
      - AI_MATCH_THRESHOLD=${AI_MATCH_THRESHOLD:-0.45}
      - AI_DISCORD_WEBHOOK_URL=${AI_DISCORD_WEBHOOK_URL:-}
      - PUID=${PUID:-}                       # lumisshow와 동일 값이어야 함 (아래 참고)
      - PGID=${PGID:-}
