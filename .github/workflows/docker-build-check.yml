name: Docker Build Check

# 릴리즈 전에 Dockerfile 빌드 실패를 미리 잡기 위한 검증 (push 없음)
on:
  push:
    branches-ignore:
      - main
    paths:
      - 'ai_worker/**'
      - 'backend/**'
      - 'docker/**'
      - '.github/workflows/docker-build-check.yml'
  workflow_dispatch:

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false

      - name: Build ai worker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ai
          push: false
          load: true
          tags: lumisshow-ai:check

      # cv2 ImportError 류 런타임 문제를 빌드 단계에서 잡기 위한 최소 검증 (v1.0.2 사례)
      - name: Smoke test ai worker image
        run: |
          docker run --rm lumisshow-ai:check python -c "import cv2, insightface, kiwipiepy, reverse_geocoder, tokenizers, onnxruntime; print('cv2', cv2.__version__)"
          docker image ls lumisshow-ai:check
